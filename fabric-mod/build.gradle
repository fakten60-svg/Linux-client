plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    // Mod Menu's own maven. Only consulted for the optional integration below;
    // nothing else here resolves from it.
    maven {
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

loom {
    // Everything this mod does is client-side, but the framework classes carry
    // no Minecraft imports so they stay in `main` and remain unit-testable
    // without a game instance.
    splitEnvironmentSourceSets()

    mods {
        "wokewtf-lite" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// A dev-only client gametest source set. It is not part of the shipped jar and
// carries no runtime dependency the mod itself would need; see docs/TESTING.md
// and src/gametest for what it checks.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'wokewtf-lite-gametest'
        // Only the client gametest is used. Server gametests would run during
        // `build`, which is not wanted here.
        enableGameTests = false
        enableClientGameTests = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Mod Menu is optional: compiled against so the integration class can
    // implement its interface, never bundled and never a runtime requirement.
    // Without it the mod loads exactly as before and only Mod Menu's own
    // "Configure" button is missing.
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    // Tests must not need a game instance. Minecraft ships slf4j and Gson, but
    // the test runtime classpath is not the game's, so they are declared
    // explicitly at the exact versions 1.21.11 bundles.
    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "org.slf4j:slf4j-api:${project.slf4j_version}"
    testRuntimeOnly "org.slf4j:slf4j-simple:${project.slf4j_version}"
    testImplementation "com.google.code.gson:gson:${project.gson_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
    it.options.compilerArgs << '-Xlint:all' << '-Xlint:-serial'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

// The client gametest is run headless. Fabric's own notes say the network
// synchroniser it installs can deadlock the world load on CI machines; the
// supported workaround is to switch it off for that run only.
tasks.matching { it.name == 'runClientGameTest' }.configureEach {
    jvmArgs '-Dfabric.client.gametest.disableNetworkSynchronizer=true'
}

// The gametest source set is dev-only and never enters the jar, but it still has
// to compile: without this, a rename that broke it would go unnoticed until
// somebody ran the test, which is the one moment it must work.
tasks.matching { it.name == 'check' }.configureEach {
    dependsOn 'compileGametestJava'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}
