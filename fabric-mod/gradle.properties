# --- Gradle itself ------------------------------------------------------------
# Configuration cache is deliberately left off: Fabric Loom 1.11 does not
# support it yet, and a half-working cache is worse than none.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# --- Minecraft toolchain ------------------------------------------------------
# Every value below was verified against maven.fabricmc.net and
# piston-meta.mojang.com on 2026-09-29. Change them here, nowhere else.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.5
fabric_api_version=0.141.6+1.21.11
loom_version=1.13.6

# --- Test toolchain -----------------------------------------------------------
junit_version=5.14.4
gson_version=2.13.2
slf4j_version=2.0.17

# --- Mod metadata -------------------------------------------------------------
mod_version=0.1.0
maven_group=wtf.woke
archives_base_name=wokewtf-lite
